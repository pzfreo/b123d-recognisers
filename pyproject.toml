[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "b123d-recognisers"
version = "0.2.5"
description = "Deterministic, geometry-only feature recognition for build123d solids"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Paul Fremantle", email = "pzfreo@gmail.com" }]
requires-python = ">=3.10,<3.15"
dependencies = ["build123d>=0.9,<0.12"]
keywords = ["build123d", "cad", "brep", "feature-recognition", "step"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/pzfreo/b123d-recognisers"
Issues = "https://github.com/pzfreo/b123d-recognisers/issues"

[project.scripts]
b123d-recognisers-capabilities = "b123d_recognisers.capabilities:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-timeout>=2.4.0",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/b123d_recognisers"]

[tool.hatch.build.targets.sdist]
include = [
    "/.github",
    "/docs",
    "/migration",
    "/src",
    "/tests",
    "/tools",
    "/CONTRIBUTING.md",
    "/RELEASE_NOTES.md",
    "/uv.lock",
]
# Vendored third-party STEP corpora: 9 MB of NIST and MFCAD++ models that the tests read but
# that no consumer of the sdist needs, and that would grow it twentyfold. They stay in the
# repository, where the tests run from; the sdist keeps carrying the tests themselves.
exclude = ["/tests/corpus"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=b123d_recognisers --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=91"
testpaths = ["tests"]

[tool.coverage.report]
# coverage.py otherwise rounds to a whole percentage before applying a decimal threshold.
precision = 2

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src/b123d_recognisers", "tests/typing/public_consumer.py"]
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "OCP.*"
ignore_missing_imports = true

# cadquery-ocp-novtk 7.9.3.1.1 is missing OCP.GccEnt. Keep this aligned with
# Draftwright until the upstream wheel is repaired.
[tool.uv]
constraint-dependencies = ["cadquery-ocp-novtk!=7.9.3.1.1"]
