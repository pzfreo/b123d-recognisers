name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A branch pushed by a workflow using GITHUB_TOKEN raises no `push` or `pull_request`
  # event, so the post-release bump PR would carry no checks at all. `publish.yml`
  # dispatches this workflow against that branch instead.
  workflow_dispatch:

# A package branch is tested once through its PR. Main-push runs remain independent evidence,
# while a newer commit supersedes the older PR head and should stop its expensive platform matrix.
concurrency:
  group: package-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv sync --dev
      # `scripts/update-recogniser-version` is named explicitly: ruff discovers *.py,
      # and an extensionless executable would otherwise be linted by nothing.
      - run: uv run ruff check . scripts/update-recogniser-version
      - run: uv run mypy

  test:
    permissions:
      contents: read
      id-token: write # Authenticate the one canonical Codecov upload without a secret.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --dev
      - run: uv run pytest
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          fail_ci_if_error: true
          files: coverage.xml
          flags: unittests
          use_oidc: true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: error
