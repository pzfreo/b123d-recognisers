[mypy]
python_version = 3.12
strict = True

[mypy-b123d_recognisers.*]
# The installed library follows the documented incremental source baseline from pyproject.toml.
# Strictness applies to this directory's consumer; the independent runtime audit prevents an
# untyped public function, class method, property, or dataclass field from hiding behind these
# private-internal allowances.
disallow_any_generics = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_untyped_defs = False

[mypy-OCP.*]
ignore_missing_imports = True
